<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자료실 메인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --rust:#B5502D;
    --rust-dark:#8A3A1E;
    --concrete:#211D19;
    --concrete-2:#2C2620;
    --warn:#E8B31C;
    --teal:#54706A;
    --paper:#E9E2D2;
    --ink:#171310;
    --line: rgba(233,226,210,.16);
  }
  html{color-scheme:dark;}
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--concrete);
    color:var(--paper);
    font-family:'Noto Sans KR',sans-serif;
    line-height:1.6;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0px, rgba(0,0,0,.35) 1px, transparent 1px, transparent 3px),
      radial-gradient(circle at 15% 10%, rgba(181,80,45,.10), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(84,112,106,.14), transparent 50%);
  }
  a{color:inherit;}
  .wrap{max-width:900px;margin:0 auto;padding:0 28px;}

  /* 경고 테이프 상단 바 */
  .tape{
    height:14px;
    background:repeating-linear-gradient(135deg, var(--warn) 0, var(--warn) 18px, var(--ink) 18px, var(--ink) 36px);
  }

  header{
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(0,0,0,.25), transparent);
  }
  .nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 0;flex-wrap:wrap;gap:16px;
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-mark{
    width:40px;height:40px;border:2px solid var(--warn);
    display:flex;align-items:center;justify-content:center;
    color:var(--warn);font-family:'Black Han Sans',sans-serif;font-size:16px;
    transform:rotate(-4deg);
    flex-shrink:0;
  }
  .brand-text .title{
    font-family:'Black Han Sans',sans-serif;
    font-size:18px;letter-spacing:1px;color:var(--paper);
  }
  .brand-text .sub{font-size:10.5px;color:var(--teal);letter-spacing:2px;}

  /* 로고 자리: 우측 상단 모서리 */
  .logo-slot{
    width:240px;
    height:64px;
    object-fit:contain;
    display:block;
    flex-shrink:0;
  }

  main{padding:64px 0 90px;}

  .evidence-head{margin-bottom:26px;}
  .scene-tag{
    display:inline-block;
    font-size:11.5px;
    letter-spacing:.4px;
    color:rgba(233,226,210,.45);
    margin-bottom:10px;
  }
  h1.evidence-title{
    font-family:'Black Han Sans',sans-serif;
    font-size:clamp(28px,4.4vw,42px);
    line-height:1.15;margin:0;color:var(--paper);
  }

  /* 메뉴 카드 */
  .evidence-card{
    border:1px solid var(--line);
    background:var(--concrete-2);
    position:relative;
  }
  .evidence-card::before{
    content:"MENU";
    position:absolute;top:14px;left:14px;
    background:var(--ink);color:var(--warn);
    font-size:10.5px;padding:4px 9px;letter-spacing:1.5px;font-weight:700;
    z-index:3;
  }

  .menu-grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:2px;
    background:var(--line);
    padding-top:0;
  }
  .menu-btn{
    position:relative;
    display:flex;flex-direction:column;justify-content:flex-end;
    min-height:190px;
    padding:26px 24px 22px;
    background:
      repeating-linear-gradient(45deg, #35302A 0 10px, #2A2620 10px 20px);
    text-decoration:none;
    overflow:hidden;
    transition:background .2s, transform .2s;
  }
  .menu-btn .num{
    position:absolute;right:16px;top:8px;
    font-family:'Black Han Sans',sans-serif;font-size:64px;line-height:1;
    color:rgba(233,226,210,.12);
    transition:color .2s;
  }
  .menu-btn .tag{
    font-size:10.5px;letter-spacing:2px;color:var(--warn);font-weight:700;margin-bottom:6px;
  }
  .menu-btn .name{
    font-family:'Black Han Sans',sans-serif;
    font-size:24px;line-height:1.25;color:var(--paper);
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .menu-btn .name::after{
    content:"→";font-family:'Noto Sans KR',sans-serif;font-size:20px;color:var(--rust);
    transition:transform .2s, color .2s;
  }
  .menu-btn::after{
    /* 하단 경고 테이프 라인 (hover 시 표시) */
    content:"";position:absolute;left:0;right:0;bottom:0;height:6px;
    background:repeating-linear-gradient(135deg, var(--warn) 0, var(--warn) 12px, var(--ink) 12px, var(--ink) 24px);
    opacity:0;transition:opacity .2s;
  }
  .menu-btn:hover,.menu-btn:focus-visible{
    background:
      repeating-linear-gradient(45deg, #3E372F 0 10px, #332D25 10px 20px);
    outline:none;
  }
  .menu-btn:hover::after,.menu-btn:focus-visible::after{opacity:1;}
  .menu-btn:hover .name::after,.menu-btn:focus-visible .name::after{transform:translateX(5px);color:var(--warn);}
  .menu-btn:hover .num,.menu-btn:focus-visible .num{color:rgba(232,179,28,.28);}

  .evidence-foot{
    padding:16px 20px;
    display:flex;justify-content:space-between;align-items:center;gap:14px;
    border-top:1px solid var(--line);
    font-size:12.5px;color:rgba(233,226,210,.5);
  }

  footer{
    border-top:1px solid var(--line);padding:24px 0;
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;
  }
  footer .copy{font-size:12px;color:rgba(233,226,210,.4);}

  @media (max-width: 560px){
    .nav{flex-direction:column;align-items:flex-start;}
    .menu-grid{grid-template-columns:1fr;}
    .menu-btn{min-height:140px;}
  }
</style>
</head>
<body>

<div class="tape"></div>

<header>
  <div class="wrap nav">
    <div class="brand">
      <div class="brand-mark">00</div>
      <div class="brand-text">
        <div class="title">[Info.Hub]</div>
        <div class="sub">UNKNOWN SOURCE · 학습 자료</div>
      </div>
    </div>
    <!-- 학교 로고 삽입 위치: src를 실제 로고 파일 경로로 교체하세요 -->
    <img class="logo-slot" src="school-logo.png" alt="학교 로고">
  </div>
</header>

<main>
  <div class="wrap">

    <div class="evidence-head">
      <!-- 소제목 -->
      <span class="scene-tag">자료실 메인 · 확인할 자료를 선택하세요</span>
      <!-- 메인 제목 -->
      <h1 class="evidence-title">[AI.metaverse.hub]</h1>
    </div>

    <div class="evidence-card">
      <!--
        버튼 4개 영역
        - 제목: <span class="name"> 안의 텍스트를 수정하세요.
        - 이동할 주소: href를 수정하세요.
          같은 저장소(GitHub Pages) 안의 페이지는 상대 경로로 적으면 됩니다.
          예) href="photo-01.html"  /  href="materials/video-02.html"
        - 다른 사이트로 이동하려면 전체 주소(https://...)를 적으세요.
        - 새 탭에서 열고 싶으면 <a> 태그에 target="_blank" rel="noopener" 를 추가하세요.
      -->
      <div class="menu-grid">

        <a class="menu-btn" href="YW/P03">
          <span class="num">01</span>
          <span class="tag">SECTION 01</span>
          <span class="name">[P03]</span>
        </a>

        <a class="menu-btn" href="YW/P10">
          <span class="num">02</span>
          <span class="tag">SECTION 02</span>
          <span class="name">[P10]</span>
        </a>

        <a class="menu-btn" href="YW/P89">
          <span class="num">03</span>
          <span class="tag">SECTION 03</span>
          <span class="name">[P89]</span>
        </a>

        <a class="menu-btn" href="YS/PI01">
          <span class="num">04</span>
          <span class="tag">SECTION 04</span>
          <span class="name">[PI01]</span>
        </a>

      </div>

      <div class="evidence-foot">
        <span>자료 구역: 4곳</span>
        <span>선택하면 해당 자료 페이지로 이동합니다</span>
      </div>
    </div>

  </div>
</main>

<footer>
  <div class="wrap" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
    <span class="copy">2026 AI METAVERSE LAB · 학생 필수 교육</span>
  </div>
</footer>

</body>
</html>
